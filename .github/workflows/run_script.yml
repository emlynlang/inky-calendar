name: Generate E-Ink Dashboard

on:
  schedule:
    # Triggers every 30 minutes on the dot
    - cron: '0,30 * * * *'
  workflow_dispatch: # Keeps a manual trigger button active in your Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Download Custom TrueType Fonts
        run: |
          chmod +x get_fonts.sh
          ./get_fonts.sh

      - name: Run generation script with Secrets injected
        env:
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python script.py

      - name: Commit and push the updated dashboard image
        run: |
          git config --global user.name "GitHub Action Server"
          git config --global user.email "action@github.com"
          git add dashboard.jpg
          git commit -m "Automated update of dashboard image" || exit 0
          git push
