name: Generate E-Ink Dashboard

on:
  # MAIN TRIGGER: cron-job.org calls GitHub every 30 minutes and starts this workflow
  # (that is the "workflow_dispatch" below). GitHub's own scheduler is unreliable
  # (it can run hours late), so the schedule here is only an hourly back-up.
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

# Only what the publish step needs: permission to push the "dashboard" branch.
permissions:
  contents: write

# Never run two updates at the same time (they would clash when saving the picture).
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Custom TrueType Fonts
        # "bash get_fonts.sh" runs the script without changing its file permissions.
        # (The old "chmod +x" made git think the file had been edited, which blocked the
        # "git pull --rebase" step below.)
        run: bash get_fonts.sh

      - name: Run generation script with Secrets injected
        env:
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          # Optional extras: leave these secrets unset and script.py uses its built-in defaults.
          TIMEZONE: ${{ secrets.TIMEZONE }}
          TIDE_LATITUDE: ${{ secrets.TIDE_LATITUDE }}
          TIDE_LONGITUDE: ${{ secrets.TIDE_LONGITUDE }}
        run: python script.py

      # Publish the two files to a branch called "dashboard". Each time, a brand-new
      # one-commit history is created and force-pushed over the old one, so the repo
      # never fills up with hundreds of old pictures. The main branch stays for code only.
      - name: Publish the dashboard files to the "dashboard" branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "GitHub Action Server"
          git config --global user.email "action@github.com"
          PUBLISH_DIR="$(mktemp -d)"
          cp dashboard.jpg dashboard.json "$PUBLISH_DIR/"
          cd "$PUBLISH_DIR"
          git init -q -b dashboard
          git add dashboard.jpg dashboard.json
          git commit -q -m "Dashboard picture"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin dashboard
